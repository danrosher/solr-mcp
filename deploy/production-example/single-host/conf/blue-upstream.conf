# Blue cluster upstream: every node of the BLUE cluster. Keep in sync with SOLR_NODES in env.blue.
#
# Every address here must ALSO be in the firewall's SOLR_NODES list, or the MCP could
# still reach that node directly. See deploy/production-example/single-host/README.md.
#
# Use IP addresses, or names that never change: nginx resolves them once at startup.
upstream solr_upstream {
  server 10.1.0.11:8983 max_fails=2 fail_timeout=10s;
  server 10.1.0.12:8983 max_fails=2 fail_timeout=10s;
  server 10.1.0.13:8983 max_fails=2 fail_timeout=10s;

  zone solr_upstream 64k;               # share node health across nginx workers
  keepalive 16;                         # reuse connections to Solr
}
