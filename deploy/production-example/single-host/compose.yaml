# One host runs BOTH the read-only proxy and the MCP server for ONE Solr cluster.
# Run it once per cluster (blue, green, ...) with a different env file:
#
#   docker compose -p solr-mcp-blue --env-file env.blue -f compose.yaml up -d
#
# Network design (the point of this file):
#
#   solr-mcp --link (internal, no gateway)--> readonly-proxy --upstream--> Solr nodes
#       |
#       '--egress--> identity provider / OTLP collector (and NOT the Solr nodes)
#
# The MCP is attached to `link` and `egress`; the proxy to `link` and `upstream`. `link` is
# internal, so it carries no default route: the MCP's only way off the host is `egress`, and the
# proxy's only way is `upstream`. A host firewall rule then rejects the `egress` subnet -> Solr
# (firewall/apply.sh). Traffic from the proxy leaves from the `upstream` subnet and is allowed.
# Subnets are fixed so the rule can name them; pick ranges that do not collide with your LAN.
name: solr-mcp-${CLUSTER:?set CLUSTER, e.g. blue}

services:
  readonly-proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ../../readonly-proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ${UPSTREAM_CONF:?set UPSTREAM_CONF to this cluster's upstream file}:/etc/nginx/solr/upstream.conf:ro
    networks: [ link, upstream ]
    read_only: true
    tmpfs: [ /var/cache/nginx, /var/run, /tmp ]
    cap_drop: [ ALL ]
    cap_add: [ CHOWN, SETGID, SETUID ]
    security_opt: [ "no-new-privileges:true" ]
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- 'http://127.0.0.1:8984/solr/admin/collections?action=LIST' >/dev/null" ]
      interval: 15s
      timeout: 5s
      retries: 3

  solr-mcp:
    image: ${MCP_IMAGE:?set MCP_IMAGE to the image built from your fork}
    restart: unless-stopped
    depends_on:
      readonly-proxy: { condition: service_healthy }
    ports:
      - "${MCP_BIND:-127.0.0.1}:${MCP_PORT:?set MCP_PORT, e.g. 8080 for blue and 8081 for green}:8080"
    networks: [ link, egress ]
    environment:
      PROFILES: http
      SOLR_URL: http://readonly-proxy:8984/solr/
      OAUTH2_ISSUER_URI: ${OAUTH2_ISSUER_URI:?set OAUTH2_ISSUER_URI; the server will not start if it is unreachable}
      SOLR_MCP_READ_ONLY: "true"
      MCP_CORS_ALLOWED_ORIGINS: ${MCP_CORS_ALLOWED_ORIGINS:-http://localhost:6274,http://127.0.0.1:6274}
      OTEL_TRACES_URL: ${OTEL_TRACES_URL:-http://localhost:4318/v1/traces}
      OTEL_METRICS_URL: ${OTEL_METRICS_URL:-http://localhost:4318/v1/metrics}
      OTEL_LOGS_URL: ${OTEL_LOGS_URL:-http://localhost:4318/v1/logs}
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75
    user: "10001:10001"
    read_only: true
    tmpfs: [ /tmp ]
    cap_drop: [ ALL ]
    security_opt: [ "no-new-privileges:true" ]
    mem_limit: 768m
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/8080 &&
          printf 'GET /actuator/health HTTP/1.0\r\n\r\n' >&3 &&
          grep -q ' 200 ' <&3
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

networks:
  link:
    internal: true
    ipam:
      config: [ { subnet: "${LINK_SUBNET:?set LINK_SUBNET}" } ]
  egress:
    ipam:
      config: [ { subnet: "${EGRESS_SUBNET:?set EGRESS_SUBNET}" } ]
  upstream:
    ipam:
      config: [ { subnet: "${UPSTREAM_SUBNET:?set UPSTREAM_SUBNET}" } ]
