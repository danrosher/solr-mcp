# One host runs the MCP, the read-only proxy AND a ZooKeeper watcher for ONE environment (test or
# prod). Traffic is split between colours (blue/green) by weights read from that environment's own
# ZooKeeper znode, e.g.  blue=120 / green=90  ->  57.14% / 42.86%.
#
#   docker compose -p solr-mcp-prod --env-file env.prod -f compose.yaml up -d --build
#
# Same network design as ../single-host/compose.yaml (read its header): the MCP is on link+egress,
# the proxy on link+upstream, so a host firewall rule can tell them apart. The watcher joins
# `upstream` ONLY: the MCP must not be able to reach ZooKeeper (it lists every node address).
#
# What differs from single-host:
#   * the proxy's upstream file is GENERATED by zk-watcher into a shared volume, and
#   * proxy-entrypoint.sh points the (unchanged) allowlist at the split's chosen upstream.
name: solr-mcp-${CLUSTER:?set CLUSTER to the environment name, e.g. prod}

services:
  zk-watcher:
    build: ./watcher
    image: ${WATCHER_IMAGE:-solr-mcp-zk-watcher:local}
    restart: unless-stopped
    environment:
      ZK_HOSTS: ${ZK_HOSTS:?set ZK_HOSTS to this environment's ZooKeeper, e.g. zk1:2181,zk2:2181}
      ZK_PATH: ${ZK_PATH:?set ZK_PATH to the traffic znode}
      COLOURS_FILE: /conf/colours.conf
      OUT_FILE: /render/upstream.conf
      DEFAULT_WEIGHTS: ${DEFAULT_WEIGHTS:-}
    volumes:
      - ${COLOURS_CONF:?set COLOURS_CONF to this environment's colour->nodes file}:/conf/colours.conf:ro
      - render:/render
    networks: [ upstream ]
    read_only: true
    tmpfs: [ /tmp ]
    cap_drop: [ ALL ]
    security_opt: [ "no-new-privileges:true" ]
    mem_limit: 128m
    healthcheck:
      test: [ "CMD-SHELL", "test -s /render/upstream.conf" ]
      interval: 5s
      timeout: 3s
      retries: 20

  readonly-proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    entrypoint: [ "/entrypoint.sh" ]
    depends_on:
      zk-watcher: { condition: service_healthy }   # the proxy cannot start without the generated file
    volumes:
      - ./proxy-entrypoint.sh:/entrypoint.sh:ro
      - ../../readonly-proxy/nginx.conf:/src/nginx.conf:ro
      - render:/etc/nginx/solr:ro
    networks: [ link, upstream ]
    read_only: true
    tmpfs: [ /var/cache/nginx, /var/run, /tmp, /etc/nginx/conf.d ]
    cap_drop: [ ALL ]
    cap_add: [ CHOWN, SETGID, SETUID ]
    security_opt: [ "no-new-privileges:true" ]
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- 'http://127.0.0.1:8984/solr/admin/collections?action=LIST' >/dev/null" ]
      interval: 15s
      timeout: 5s
      retries: 3

  solr-mcp:
    image: ${MCP_IMAGE:?set MCP_IMAGE to the image built from your fork}
    restart: unless-stopped
    depends_on:
      readonly-proxy: { condition: service_healthy }
    ports:
      - "${MCP_BIND:-127.0.0.1}:${MCP_PORT:?set MCP_PORT, e.g. 8080 for prod and 8081 for test}:8080"
    networks: [ link, egress ]
    environment:
      PROFILES: http
      SOLR_URL: http://readonly-proxy:8984/solr/
      OAUTH2_ISSUER_URI: ${OAUTH2_ISSUER_URI:?set OAUTH2_ISSUER_URI; the server will not start if it is unreachable}
      SOLR_MCP_READ_ONLY: "true"
      MCP_CORS_ALLOWED_ORIGINS: ${MCP_CORS_ALLOWED_ORIGINS:-http://localhost:6274,http://127.0.0.1:6274}
      OTEL_TRACES_URL: ${OTEL_TRACES_URL:-http://localhost:4318/v1/traces}
      OTEL_METRICS_URL: ${OTEL_METRICS_URL:-http://localhost:4318/v1/metrics}
      OTEL_LOGS_URL: ${OTEL_LOGS_URL:-http://localhost:4318/v1/logs}
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75
    user: "10001:10001"
    read_only: true
    tmpfs: [ /tmp ]
    cap_drop: [ ALL ]
    security_opt: [ "no-new-privileges:true" ]
    mem_limit: 768m
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/8080 &&
          printf 'GET /actuator/health HTTP/1.0\r\n\r\n' >&3 &&
          grep -q ' 200 ' <&3
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

volumes:
  render: {}

networks:
  link:
    internal: true
    ipam:
      config: [ { subnet: "${LINK_SUBNET:?set LINK_SUBNET}" } ]
  egress:
    ipam:
      config: [ { subnet: "${EGRESS_SUBNET:?set EGRESS_SUBNET}" } ]
  upstream:
    ipam:
      config: [ { subnet: "${UPSTREAM_SUBNET:?set UPSTREAM_SUBNET}" } ]
