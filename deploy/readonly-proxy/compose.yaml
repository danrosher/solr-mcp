# Adds the read-only proxy to the repo's local dev stack.
#
#   docker compose -f compose.yaml -f deploy/readonly-proxy/compose.yaml up -d solr zoo solr-readonly-proxy
#
# The proxy listens on http://localhost:8984. Point the MCP server at it:
#   SOLR_URL=http://localhost:8984/solr/
#
# Local testing only. In production the proxy must be the ONLY route from the
# MCP server to Solr (network policy / firewall), otherwise it is advisory.
services:
  solr-readonly-proxy:
    image: nginx:1.27-alpine
    depends_on: [ solr ]
    networks: [ search ]
    ports:
      - "127.0.0.1:8984:8984"
    volumes:
      - ./deploy/readonly-proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/readonly-proxy/upstream.demo.conf:/etc/nginx/solr/upstream.conf:ro
