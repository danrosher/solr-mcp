# Read-only allowlist proxy for Solr, for use between the Solr MCP server and Solr.
# Everything not explicitly allowed below is refused with 403.
#
# Mounted as /etc/nginx/conf.d/default.conf, so this file holds server-level
# directives only.
#
# The Solr nodes live in a separate file, mounted at /etc/nginx/solr/upstream.conf,
# so one copy of this allowlist can serve several clusters (e.g. blue and green)
# with a different node list each. See upstream.example.conf and upstream.demo.conf.
#
# The proxy also load-balances across those nodes. In SolrCloud any node can
# answer a query for any collection, so plain round-robin is fine. nginx (open
# source) only notices a dead node when a request to it fails, then retries the
# next one (see proxy_next_upstream below). Node hostnames are resolved once at
# startup: reload nginx if an address changes.
include /etc/nginx/solr/upstream.conf;

server {
  listen 8984;

  client_max_body_size 1k;              # no legitimate read request has a body
  large_client_header_buffers 4 16k;    # long fq lists travel in the URL
  proxy_read_timeout 30s;

  # Max query time in ms, applied to every /select (see below).
  set $solr_time_allowed 5000;

  # Needed for upstream keepalive, and failover across nodes. Only GETs are
  # allowed through, so retrying on another node is safe.
  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_connect_timeout 2s;
  proxy_next_upstream error timeout http_502 http_503 http_504;
  proxy_next_upstream_tries 3;

  # Refuse by default. Refusals are JSON so SolrJ (and therefore the MCP tool
  # result) shows a readable message instead of "Expected mime type ... text/html".
  error_page 403 = @denied;
  location @denied {
    default_type application/json;
    return 403 '{"error":{"code":403,"msg":"Blocked by read-only proxy: this Solr endpoint is not available to the MCP server."}}';
  }
  location / { return 403; }

  # Reject percent-encoded characters in parameter NAMES. $args is not decoded,
  # so `%71t=/update` would otherwise slip past the name checks in /select.
  # (Percent-encoding in parameter values, e.g. q=title%3Afoo, is unaffected.)

  # search: GET only so the $args checks see every parameter
  location ~ ^/solr/[A-Za-z0-9_.-]+/select$ {
    limit_except GET { deny all; }
    if ($args ~ "(^|&)[^=&]*%")                           { return 403; }
    if ($args ~* "(^|&)(stream\.|shards=|shards\.qt=|qt=)") { return 403; }
    # Every query gets a time limit. It goes FIRST because Solr uses the first value of a
    # repeated parameter, so a client-supplied timeAllowed (any larger value) is ignored.
    # (Percent-encoded names are refused above, so it cannot be smuggled in.) Past the limit
    # Solr returns partial results with responseHeader.partialResults=true instead of
    # running on; keep it below Solr's inter-shard timeout so shards fail soft.
    proxy_pass http://solr_upstream$uri?timeAllowed=$solr_time_allowed&$args;
  }

  location ~ ^/solr/[A-Za-z0-9_.-]+/schema$ {
    limit_except GET { deny all; }
    proxy_pass http://solr_upstream$uri$is_args$args;
  }

  location ~ ^/solr/[A-Za-z0-9_.-]+/admin/luke$ {
    limit_except GET { deny all; }
    proxy_pass http://solr_upstream$uri$is_args$args;
  }

  # ping: action=enable|disable modifies the health-check file, so refuse any action
  location ~ ^/solr/[A-Za-z0-9_.-]+/admin/ping$ {
    limit_except GET { deny all; }
    if ($args ~ "(^|&)[^=&]*%") { return 403; }
    if ($arg_action)            { return 403; }
    proxy_pass http://solr_upstream$uri$is_args$args;
  }

  location = /solr/admin/metrics {
    limit_except GET { deny all; }
    proxy_pass http://solr_upstream$uri$is_args$args;
  }

  # collections API: only the two read actions, and exactly one action param
  location = /solr/admin/collections {
    limit_except GET { deny all; }
    if ($args ~ "(^|&)[^=&]*%")                { return 403; }
    if ($arg_action !~ "^(LIST|LISTALIASES)$") { return 403; }
    if ($args ~* "action=.*action=")           { return 403; }
    proxy_pass http://solr_upstream$uri$is_args$args;
  }
}
